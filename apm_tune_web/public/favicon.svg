<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#212c3b"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="rotor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79b8ff"/>
      <stop offset="100%" stop-color="#2f6fd0"/>
    </linearGradient>
    <linearGradient id="rotorWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a35e"/>
      <stop offset="100%" stop-color="#d9702a"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底 (与站点主题一致) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- X 形机臂 -->
  <g stroke="#3b4a61" stroke-width="3.5" stroke-linecap="round">
    <path d="M32 32 L14 14"/>
    <path d="M32 32 L50 14"/>
    <path d="M32 32 L14 50"/>
    <path d="M32 32 L50 50"/>
  </g>

  <!-- 四个旋翼 (240° 旋转弧 = 动态感; 右上为橙色点缀) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M6.64 9.75 A8.5 8.5 0 1 1 14 22.5" stroke="url(#rotor)"/>
    <path d="M57.36 9.75 A8.5 8.5 0 1 1 42.64 9.75" stroke="url(#rotorWarm)"/>
    <path d="M9.75 57.36 A8.5 8.5 0 1 1 22.5 50" stroke="url(#rotor)"/>
    <path d="M42.64 45.75 A8.5 8.5 0 1 1 50 58.5" stroke="url(#rotor)"/>
  </g>

  <!-- 中心桨座 + 「扶」 -->
  <circle cx="32" cy="32" r="9.5" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="32" y="33.6" text-anchor="middle" dominant-baseline="middle"
        font-size="13" font-weight="700" fill="#e6edf3"
        font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">扶</text>
</svg>
