# 扶摇 FuyaoTune 服务器部署
#   基础启动:  docker compose up -d --build          → http://服务器IP:3000
#   启用 HTTPS (Web Serial 需要安全上下文, 公网部署必须):  见下方 caddy profile
#
# 环境变量 (写入 .env 或直接 export):
#   AUTH_USER / AUTH_PASS   HTTP Basic 认证账号密码 (公网强烈建议设置)
#   APM_DOMAIN              使用 tls profile 时的访问域名/IP
#   STATS_TOKEN             使用统计仪表盘口令 (设置后访问 /stats?token=口令; 建议 16 位以上随机串)
#   STATS_DISABLED=1        完全关闭匿名使用统计 (默认开启, 仅统计 PV/UV/功能次数, 不含 IP/飞控数据)
services:
  apm-tune:
    build: .
    ports:
      # APM_BIND=127.0.0.1 时仅本机可直连 (配合 nginx 前置反代, 对外只留 443/8443 TLS 入口)
      - "${APM_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
      - STATS_TOKEN=${STATS_TOKEN:-}
      - STATS_DISABLED=${STATS_DISABLED:-}
    volumes:
      - ./backups:/app/backups      # 参数备份
      - ./logs:/app/logs            # 下载的飞行日志
      - ./faults:/app/faults        # 故障速查记录
      - ./config:/app/config        # AI 配置(含 Key, 注意权限)
      - ./stats:/app/stats          # 匿名使用统计 (按天分桶 JSON)
    restart: unless-stopped

  # HTTPS 反代 (Web Serial 要求 HTTPS 或 localhost, 公网部署必须):
  #   标准 443:  APM_DOMAIN=你的域名 docker compose --profile tls up -d
  #   指定端口:  APM_DOMAIN=域名:6000 TLS_PORT=6000 docker compose --profile tls up -d   → https://域名:6000
  #   (Caddy 自动签发 Let's Encrypt 证书; Caddyfile 保留 tls internal 时为自建 CA 证书,
  #    浏览器首次访问需点「高级 → 继续前往」, 详见 Caddyfile 注释)
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    ports:
      - "${TLS_PORT:-443}:${TLS_PORT:-443}"
    environment:
      - APM_DOMAIN=${APM_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls.conf:/etc/caddy/tls.conf:ro   # TLS 证书策略 (默认 tls internal)
      - ./tls:/etc/caddy/tls:ro             # 正式证书目录 (acme.sh --install-cert 写入)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - apm-tune
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}
